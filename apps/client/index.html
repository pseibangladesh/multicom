<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bengal Exchange</title>
  <meta key="title" content="Bengal Exchange" property="og:title" />
  <meta content="Bengal Exchange is a platform for managing your business." property="og:description" />
  <meta content="Bengal Exchange is a platform for managing your business." name="description" />
  <meta name="color-scheme" content="light dark" />
  <link href="/favicon.ico" rel="icon" />
  <script>
    // Before first paint: Bengal theme, light/dark mode and language direction,
    // using the same rules as src/lib/theme.ts (resolveMode, migrateLegacyTheme)
    // and src/lib/languages.ts (RTL list). Keep them in step.
    (function () {
      // Must match src/lib/languages.ts (checked by src/__tests__/i18n.test.ts).
      var SUPPORTED = ["en-US", "fr-FR", "es-ES", "zh-CN", "ar-SA", "he-IL", "bn-BD"];
      var RTL = ["ar-SA", "he-IL"];
      var root = document.documentElement;
      var mode = null, lang = null;
      try {
        // Retired luxury switcher: "luxury-dark" in ui-theme was a dark choice.
        var legacy = localStorage.getItem("ui-theme");
        if (legacy !== null) {
          if (/-dark$/.test(legacy)) localStorage.setItem("theme", "dark");
          localStorage.removeItem("ui-theme");
        }
        mode = localStorage.getItem("theme");
        lang = localStorage.getItem("preferredLanguage");
      } catch (e) {}
      if (mode !== "light" && mode !== "dark") {
        mode = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.setAttribute("data-theme", "bengal");
      root.classList.add(mode);
      root.style.colorScheme = mode;
      // Unsupported or missing saved language: English (same as resolveLanguage).
      if (SUPPORTED.indexOf(lang) === -1) lang = "en-US";
      root.lang = lang;
      root.dir = RTL.indexOf(lang) !== -1 ? "rtl" : "ltr";
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
